server:
  port: 8081
spring:
  application:
    name: mailsender
  servlet:
    multipart:
      # guarda externa, folgada de proposito: quem fala e o limite derivado em
      # mailsender.attachments, com mensagem explicando o porque
      max-file-size: 20MB
      max-request-size: 22MB
  rabbitmq:
    listener:
      simple:
        concurrency: 2
        max-concurrency: 5
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 3000ms
          max-retries: 3
          multiplier: 2.0
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driverClassName: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true
    url: ${SPRING_DATASOURCE_URL}
    password: ${SPRING_DATASOURCE_PASSWORD}
    user: ${SPRING_DATASOURCE_USERNAME}


ceph:
  endpoint: ${CEPH_ENDPOINT}
  access-key: ${CEPH_ACCESS_KEY}
  secret-key: ${CEPH_SECRET_KEY}

mailsender:
  attachments:
    # limite de mensagem do provedor; o orcamento de bytes crus e ~1/1.37 disso
    max-message-size: 25MB
  throttle:
    max-cycles: 10
  purge:
    # expurgo e irreversivel: desligue por aqui, sem deploy
    enabled: true
    cron: "0 11 8 * * *"
    retention-days: 1 #90
    batch-size: 200
  accounts:
    - name: mailhog - externo
      host: smtp.mailhog.site
      port: 2525
      username: u_75468a9d
      password: p_fe025a623ed5c6b9
      max-per-minute: 30
    - name: office365 - pmo
      host: smtp.office365.com
      port: 587
      username: protocolo@osasco.sp.gov.br
      password: pmo@202106
      max-per-minute: 30
      auth: true
      start-tls: true
      # `from` vazio usa o username, que e o que o Exchange exige: a caixa
      # autenticada so pode enviar como ela mesma. Só preencha diferente se houver
      # permissao SendAs sobre o outro endereco.

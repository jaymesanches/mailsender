# Resolve os placeholders de application.yml nos testes de integracao,
# substituindo o .env de cada desenvolvedor. Valores batem com compose.yaml.
RABBITMQ_HOST=localhost
RABBITMQ_PORT=5672
RABBITMQ_USERNAME=guest
RABBITMQ_PASSWORD=guest

MAIL_HOST=localhost
MAIL_PORT=1025
MAIL_SMTP_AUTH=false
MAIL_SMTP_STARTTLS=false

SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/mailsender_db
SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
SPRING_DATASOURCE_USERNAME=mailsender
SPRING_DATASOURCE_PASSWORD=mailsender
SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect

CEPH_ENDPOINT=http://localhost:9000
CEPH_ACCESS_KEY=minioadmin
CEPH_SECRET_KEY=minioadmin

# O consumer e invocado direto nos testes; nao precisa de broker de pe.
spring.rabbitmq.listener.simple.auto-startup=false

# Pipeline: um unico `mvnw package` roda os testes unitarios e produz o jar; o job de
# imagem consome esse jar como artifact. A aplicacao e compilada UMA vez no pipeline —
# a imagem nao compila (ver Dockerfile).
#
# Os testes @Tag("integration") NAO rodam por padrao: exigem Postgres, e o surefire ja
# os exclui via test.excludedGroups no pom. Para liga-los, veja test:integration.
#
# O deploy nao esta aqui: acontece no servidor com compose.deploy.yaml.

stages:
  - package
  - publish

variables:
  # repo local dentro do workspace: e a unica forma de o cache do GitLab persistir
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Djava.awt.headless=true"
  MAVEN_CLI_OPTS: "-B -ntp"

  # registry:2 avulso na mesma maquina do GitLab, sem autenticacao — nao e o
  # Container Registry do GitLab, entao $CI_REGISTRY_* nao serve aqui e nao ha login
  IMAGE_NAME: "10.117.2.204:5000/mailsender"

# ---------------- package ----------------

# Compila, roda a suite unitaria e empacota, tudo numa invocacao.
#
# O `image:` sobrescreve a imagem default do runner: os runners deste GitLab sobem com
# Java 17 e 21, e o projeto exige 25.
package:
  stage: package
  # Os runners deste GitLab nao aceitam job sem tag, e a tag e o nome do runner.
  tags:
    - java-runner
  image: eclipse-temurin:25-jdk
  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository
  script:
    - ./mvnw $MAVEN_CLI_OPTS package
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/*.jar
    reports:
      junit: target/surefire-reports/TEST-*.xml

# ---------------- publish ----------------

# NAO renomeie este job para `image`: e keyword global do GitLab CI, e o parser passa a
# ler o mapa do job como nome de imagem ("image name should be a string").
publish:image:
  stage: publish

  # Obrigatorio: so o docker-runner monta /var/run/docker.sock. Nos outros o
  # `docker build` falha com "Cannot connect to the Docker daemon".
  tags:
    - docker-runner

  # SEM servico dind: com o socket montado a CLI fala direto com o daemon do host.
  # DinD exigiria privileged=true, e os tres runners estao com privileged=false.
  # Quem precisa de `insecure-registries` para 10.117.2.204:5000 e o daemon do HOST.
  #
  # Se der erro de versao de API, troque por `docker:stable` — e a imagem que os
  # outros projetos deste GitLab usam neste mesmo runner.
  image: docker:27-cli

  # traz o jar do job anterior; sem isso o COPY do Dockerfile falha
  needs:
    - job: package
      artifacts: true
  script:
    - 'if ! ls target/*.jar >/dev/null 2>&1; then echo "jar ausente - o artifact do job package nao chegou"; exit 1; fi'
    # Com socket binding o cache de imagens do host persiste entre jobs, entao o build
    # tende a ser rapido. O pull ainda ajuda na primeira execucao num host novo.
    - docker pull "$IMAGE_NAME:latest" || true
    - >
      docker build
      --cache-from "$IMAGE_NAME:latest"
      --tag "$IMAGE_NAME:latest"
      --tag "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
      .
    # :latest e o que o compose do servidor consome
    - docker push "$IMAGE_NAME:latest"
    # a tag do commit vai junto de graca (mesma imagem, so outro nome) e e o unico
    # caminho de volta se a :latest quebrar — sem ela nao existe rollback
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------- integracao (opcional) ----------------

# Desligado por padrao. Para ligar, defina RUN_INTEGRATION_TESTS=true nas variaveis do
# projeto ou do pipeline.
#
# Os runners sao de executor docker, entao o `services` abaixo funciona: e o GitLab que
# sobe o postgres:17-alpine descartavel, nao um Postgres instalado no servidor.
#
# Ligar recompila a aplicacao (segundo compile do pipeline) — e o preco de manter este
# job separado do `package`, que precisa rodar sem infraestrutura.
#
# Vale o custo por um motivo alem dos testes: as migrations sao aplicadas num banco
# vazio, validando o caminho de instalacao limpa.
test:integration:
  stage: package
  tags:
    - java-runner
  image: eclipse-temurin:25-jdk
  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: mailsender_db
    POSTGRES_USER: mailsender
    POSTGRES_PASSWORD: mailsender
    # application-test.properties aponta para localhost, que nao existe aqui: o servico
    # atende no alias `postgres`. Variavel de ambiente tem precedencia sobre o arquivo.
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/mailsender_db"
  script:
    - ./mvnw $MAVEN_CLI_OPTS test -Dtest.excludedGroups= -Dgroups=integration
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: target/surefire-reports/TEST-*.xml
  rules:
    - if: $RUN_INTEGRATION_TESTS == "true"

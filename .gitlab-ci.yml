# Pipeline: um unico `mvnw package` roda os 118 testes unitarios e produz o jar; o
# job de imagem consome esse jar como artifact. A aplicacao e compilada UMA vez no
# pipeline — a imagem nao compila (ver Dockerfile).
#
# Os 12 testes @Tag("integration") NAO rodam por padrao: exigem Postgres, e o
# surefire ja os exclui via test.excludedGroups no pom. Para liga-los, veja o job
# test:integration no fim deste arquivo.
#
# O deploy nao esta aqui: acontece no servidor com compose.deploy.yaml, usando a tag
# imutavel :$CI_COMMIT_SHORT_SHA em MAILSENDER_IMAGE.

stages:
  - package
  - image

variables:
  # repo local dentro do workspace: e a unica forma de o cache do GitLab persistir
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Djava.awt.headless=true"
  MAVEN_CLI_OPTS: "-B -ntp"

# ---------------- package ----------------

# Compila, roda a suite unitaria e empacota, tudo numa invocacao. Nao depende de
# infraestrutura, entao roda em qualquer executor de runner.
package:
  stage: package
  image: eclipse-temurin:25-jdk
  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository
  script:
    - ./mvnw $MAVEN_CLI_OPTS package
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/*.jar
    reports:
      junit: target/surefire-reports/TEST-*.xml

# ---------------- image ----------------

image:
  stage: image
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  # traz o jar do job anterior; sem isso o COPY do Dockerfile falha
  needs:
    - job: package
      artifacts: true
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - if ! ls target/*.jar >/dev/null 2>&1; then echo "jar ausente: o artifact do job package nao chegou"; exit 1; fi
    # Sem --cache-from o DinD comeca do zero; com o jar pronto o build e curto, mas
    # as camadas de dependencia (~77MB) so sao reaproveitadas se a :latest vier antes.
    - docker pull "$CI_REGISTRY_IMAGE:latest" || true
    - >
      docker build
      --cache-from "$CI_REGISTRY_IMAGE:latest"
      --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      .
    # tag imutavel primeiro: e a que permite rollback por commit
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------- integracao (opcional) ----------------

# Desligado por padrao. Para ligar, defina RUN_INTEGRATION_TESTS=true nas variaveis
# do projeto ou do pipeline.
#
# Exige runner de executor **docker** ou **kubernetes**: e o GitLab que sobe o
# postgres:17-alpine descartavel abaixo, nao um Postgres instalado no servidor. Em
# executor shell o bloco `services` e ignorado sem aviso e o job falha na conexao.
#
# Ligar tambem recompila a aplicacao (segundo compile do pipeline) — e o preco de
# manter este job separado do `package`, que precisa rodar sem infraestrutura.
#
# Vale o custo por um motivo alem dos testes: as migrations V1..V5 sao aplicadas num
# banco vazio, validando o caminho de instalacao limpa.
test:integration:
  stage: package
  image: eclipse-temurin:25-jdk
  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: mailsender_db
    POSTGRES_USER: mailsender
    POSTGRES_PASSWORD: mailsender
    # application-test.properties aponta para localhost, que nao existe aqui: o
    # servico atende no alias `postgres`. Variavel de ambiente tem precedencia
    # sobre o arquivo de properties, entao basta sobrescrever a URL.
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/mailsender_db"
  script:
    - ./mvnw $MAVEN_CLI_OPTS test -Dtest.excludedGroups= -Dgroups=integration
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: target/surefire-reports/TEST-*.xml
  rules:
    - if: $RUN_INTEGRATION_TESTS == "true"
